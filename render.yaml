services:
  - type: web
    name: seat-lock-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm db:deploy && pnpm start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ORGANIZER_EMAIL
        sync: false
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
